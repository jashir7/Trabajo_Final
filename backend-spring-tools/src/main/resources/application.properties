spring.application.name=gestionaprendices
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_aprendices?serverTimezone=UTC}
spring.datasource.username=${DB_USER:gestion_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
app.data-backup.path=${DATA_BACKUP_PATH:data/database.json}
